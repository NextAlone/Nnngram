name: Build CI

on:
  push:
    branches:
      - main
    paths-ignore:
        - '**.md'
        - '**.txt'
        - '.github/**'
        - '!.github/workflows/**'
        - '!.github/scripts/**'
        - "TMessagesProj/src/main/res/values**/**"
        - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Gradle Build
    if: ${{ github.event_name != 'pull_request' && success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Check out submodules
        run: |
          git submodule update --init --recursive
      - name: Get short SHA
        run: |
          echo "SHA7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-stable
          restore-keys: ccache-stable
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare Environment
        run: |
            echo "Removing large packages"
            sudo apt-get remove -y '^dotnet-.*' aspnetcore-targeting-pack-6.0
            sudo apt-get remove -y '^llvm-.*'
            sudo apt-get remove -y 'php.*'
            sudo apt-get remove -y '^mongodb-.*'
            sudo apt-get remove -y '^mysql-.*'
            sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri
            sudo apt-get autoremove -y
            sudo apt-get clean
            echo "Removing large directories"
            sudo rm -rf /usr/share/dotnet/
            sudo rm -rf /usr/local/graalvm/
            sudo rm -rf /usr/local/.ghcup/
            sudo rm -rf /usr/local/share/powershell
            sudo rm -rf /usr/local/share/chromium
            sudo rm -rf /usr/local/lib/node_modules
            df -h
            sudo apt-get install bison gcc make curl ninja-build -y
            echo "y" | sdkmanager --install "ndk;28.1.13356709" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
            echo "sdk.dir=${ANDROID_HOME}" >> local.properties
            export ANDROID_SDK=${ANDROID_HOME}
      - name: Debug Build
        run: |
          echo -e "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}\nRELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}\nRELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}">>local.properties
          mkdir -p TMessagesProj/config/
          echo "${{ secrets.KEYSTORE }}" | base64 -d > TMessagesProj/config/release.keystore
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > TMessagesProj/google-services.json
          ./gradlew :TMessagesProj:assembleRelease :TMessagesProj:uploadCrashlyticsSymbolFileRelease
          echo "APK_FILE=$(find TMessagesProj/build/outputs/apk -name '*arm64*.apk')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        name: Upload apk (arm64-v8a)
        with:
          name: Nnngram-arm64-v8a-${{ env.SHA7 }}
          path: ${{ env.APK_FILE }}

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: TMessagesProj/build/outputs/mapping



  upload:
    name: Upload Release
    if: ${{ github.event_name != 'pull_request' && success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs:
      - build
      - telegram-bot-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last-sent SHA
        id: restore_last_sent
        uses: actions/cache/restore@v4
        with:
          path: .ci-last-sent-sha
          # Save key (below) embeds run_id so each successful upload writes a
          # fresh entry. restore-keys finds the most recent prefix match.
          key: ci-last-sent-${{ github.ref_name }}-placeholder
          restore-keys: |
            ci-last-sent-${{ github.ref_name }}-
      - name: Read last-sent SHA
        id: last_sent
        run: |
          if [ -f .ci-last-sent-sha ]; then
            sha=$(tr -d '[:space:]' < .ci-last-sent-sha)
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "last sent: $sha"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "no cached last-sent sha (first run or evicted)"
          fi
      - name: Donwload Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Download Telegram Bot API Binary
        uses: actions/download-artifact@v4
        with:
          name: telegram-bot-api-binary
          path: .

      - name: find apk
        run: |
            mkdir apks
            find artifacts -name "*.apk" -exec cp {} apks \;
            echo "APK_FILE_UPLOAD=$(find apks -name '*arm64*.apk')" >> $GITHUB_ENV
      - name: Get Apk Info
        id: apk
        uses: JantHsueh/get-apk-info-action@master
        with:
          apkPath: ${{ env.APK_FILE_UPLOAD }}

      - name: Release
        run: |
          chmod +x telegram-bot-api-binary
          ./telegram-bot-api-binary --api-id=21724 --api-hash=3e0cb5efcd52300aec5994fdfc5bdc16 --local 2>&1 > /dev/null &
          pip install --quiet requests
          python3 .github/scripts/upload_ci.py
        env:
            CHAT_ID: ${{ secrets.TELEGRAM_CHATID }}
            TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
            VERSION_CODE: ${{ steps.apk.outputs.versionCode }}
            VERSION_NAME: ${{ steps.apk.outputs.versionNum }}
            LAST_SENT_SHA: ${{ steps.last_sent.outputs.sha }}
            HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
            COMMITS_JSON: ${{ toJSON(github.event.commits) }}
            REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - name: Record successful upload SHA
        if: success()
        run: echo "${{ github.sha }}" > .ci-last-sent-sha
      - name: Save last-sent SHA
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .ci-last-sent-sha
          key: ci-last-sent-${{ github.ref_name }}-${{ github.run_id }}

  telegram-bot-api:
    name: Telegram Bot API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clone Telegram Bot API
        run: |
          git clone --recursive https://github.com/tdlib/telegram-bot-api.git
          git status telegram-bot-api >> telegram-bot-api-status
      - name: Cache Bot API Binary
        id: cache-bot-api
        uses: actions/cache@v4
        with:
          path: telegram-bot-api-binary
          key: CI-telegram-bot-api-${{ hashFiles('telegram-bot-api-status') }}
      - name: Compile Telegram Bot API
        if: steps.cache-bot-api.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install make git zlib1g-dev libssl-dev gperf cmake g++
          cd telegram-bot-api
          rm -rf build
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=.. ..
          cmake --build . --target install -j$(nproc)
          cd ../..
          ls -l telegram-bot-api/bin/telegram-bot-api*
          cp telegram-bot-api/bin/telegram-bot-api telegram-bot-api-binary
      - name: Upload Binary
        uses: actions/upload-artifact@master
        with:
          name: telegram-bot-api-binary
          path: telegram-bot-api-binary
